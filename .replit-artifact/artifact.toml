kind = "web"
previewPath = "/"
title = "Corva Health Consulting"
version = "1.0.0"
id = "artifacts/corva-health"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24802

[services.development]
run = "pnpm --filter @workspace/corva-health run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/corva-health", "run", "build" ]
publicDir = "artifacts/corva-health/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24802"
BASE_PATH = "/"
